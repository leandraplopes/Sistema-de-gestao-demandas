<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão de Demandas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Sistema de Gestão de Demandas</h1>

  <p>Bem-vindo ao sistema!</p>

  <button id="btnNovaDemanda">Nova demanda</button>

  <div id="formulario" style="display: none; margin-top: 30px;">

    <h2>Nova Demanda</h2>

    <input
      type="text"
      id="titulo"
      placeholder="Título da demanda"
    >

    <br><br>

    <textarea
      id="descricao"
      placeholder="Descreva a demanda"
      rows="5"
      cols="40"
    ></textarea>

    <br><br>

    <p><strong>Status:</strong></p>

    <button type="button" class="btnStatus" data-status="Aberta">
      Aberta
    </button>

    <button type="button" class="btnStatus" data-status="Em andamento">
      Em andamento
    </button>

    <button type="button" class="btnStatus" data-status="Concluída">
      Concluída
    </button>

    <p>Status selecionado: <strong id="statusSelecionado">Aberta</strong></p>

    <br>

    <button id="btnSalvar">Cadastrar demanda</button>

  </div>

  <div id="listaDemandas" style="margin-top: 30px;"></div>

  <script>

    const btnNovaDemanda = document.getElementById("btnNovaDemanda");
    const formulario = document.getElementById("formulario");
    const btnSalvar = document.getElementById("btnSalvar");
    const listaDemandas = document.getElementById("listaDemandas");
    const statusSelecionado = document.getElementById("statusSelecionado");

    let statusAtual = "Aberta";
    let prioridadeAtual = "Média";

    btnNovaDemanda.addEventListener("click", function() {
      formulario.style.display = "block";
    });

    document.querySelectorAll(".btnStatus").forEach(function(botao) {

      botao.addEventListener("click", function() {

        statusAtual = botao.dataset.status;

        statusSelecionado.textContent = statusAtual;

      });

    });
    document.querySelectorAll(".btnPrioridade").forEach(function(botao) {

  botao.addEventListener("click", function() {

    prioridadeAtual = botao.dataset.prioridade;

    document.getElementById("prioridadeSelecionada").textContent = prioridadeAtual;

  });

});

    btnSalvar.addEventListener("click", function() {

      const titulo = document.getElementById("titulo").value;
      const descricao = document.getElementById("descricao").value;

      if (titulo === "" || descricao === "") {
        alert("Preencha o título e a descrição.");
        return;
      }

      const demanda = document.createElement("div");

      demanda.innerHTML = `
        <h3>${titulo}</h3>
        <p>${descricao}</p>
        <p><strong>Status:</strong> ${statusAtual}</p>
        <hr>
      `;

      listaDemandas.appendChild(demanda);

      document.getElementById("titulo").value = "";
      document.getElementById("descricao").value = "";

      statusAtual = "Aberta";
      statusSelecionado.textContent = "Aberta";

      formulario.style.display = "none";

    });

  </script>

</body>
</html>
<p><strong>Prioridade:</strong></p>

<button type="button" class="btnPrioridade" data-prioridade="Baixa">
  Baixa
</button>

<button type="button" class="btnPrioridade" data-prioridade="Média">
  Média
</button>

<button type="button" class="btnPrioridade" data-prioridade="Alta">
  Alta
</button>

<p>Prioridade selecionada: <strong id="prioridadeSelecionada">Média</strong></p>
