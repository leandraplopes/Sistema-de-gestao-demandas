[20:11, 08/08/2026] leandra p lopess: <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão de Demandas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Sistema de Gestão de Demandas</h1>

  <p>Bem-vindo ao sistema!</p>

  <button id="btnNovaDemanda">Nova demanda</button>

  <div id="formulario" style="display: none; margin-top: 30px;">

    <h2>Nova Demanda</h2>

    <input
      type="text"
      id="titulo"
      placeholder="Título da demanda"
    >

    <br><br>

    <textarea
      id="descricao"
      placeholder="Descreva a demanda"
      rows="5"
      cols="40"
    ></textarea>

    <br><br>

    <label for="status">Status:</label>

    <select id="status">
      <option value="Aberta">Aberta</option>
      <option value="Em andamento">Em andamento</option>
      <option value="Concluída">Concluída</option>
    </select>

    <br><br>

    <button id="btnSalvar">Cadastrar demanda</button>

  </div>

  <div id="listaDemandas" style="margin-top: 30px;"></div>

  <script src="script.js"></script>

</body>
</html>
