<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão de Demandas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Sistema de Gestão de Demandas</h1>

  <p>Bem-vindo ao sistema!</p>

  <button id="btnNovaDemanda">Nova demanda</button>

  <div id="formulario" style="display: none; margin-top: 30px;">

    <h2>Nova Demanda</h2>

    <input
      type="text"
      id="titulo"
      placeholder="Título da demanda"
    >

    <br><br>

    <textarea
      id="descricao"
      placeholder="Descreva a demanda"
      rows="5"
      cols="40"
    ></textarea>

    <br><br>

    <p><strong>Status:</strong></p>

    <button type="button" onclick="selecionarStatus('Aberta')">
      Aberta
    </button>

    <button type="button" onclick="selecionarStatus('Em andamento')">
      Em andamento
    </button>

    <button type="button" onclick="selecionarStatus('Concluída')">
      Concluída
    </button>

    <p>
      Status selecionado:
      <strong id="statusSelecionado">Aberta</strong>
    </p>

    <p><strong>Prioridade:</strong></p>

    <button type="button" onclick="selecionarPrioridade('Baixa')">
      Baixa
    </button>

    <button type="button" onclick="selecionarPrioridade('Média')">
      Média
    </button>

    <button type="button" onclick="selecionarPrioridade('Alta')">
      Alta
    </button>

    <p>
      Prioridade selecionada:
      <strong id="prioridadeSelecionada">Média</strong>
    </p>

    <br>

    <button id="btnSalvar">Cadastrar demanda</button>

  </div>

  <div id="listaDemandas" style="margin-top: 30px;"></div>

  <script>

    let statusAtual = "Aberta";
    let prioridadeAtual = "Média";

    let demandas = JSON.parse(localStorage.getItem("demandas")) || [];

    const btnNovaDemanda = document.getElementById("btnNovaDemanda");
    const formulario = document.getElementById("formulario");
    const btnSalvar = document.getElementById("btnSalvar");
    const listaDemandas = document.getElementById("listaDemandas");

    btnNovaDemanda.addEventListener("click", function() {
      formulario.style.display = "block";
    });

    function selecionarStatus(status) {
      statusAtual = status;

      document.getElementById("statusSelecionado").textContent = status;
    }

    function selecionarPrioridade(prioridade) {
      prioridadeAtual = prioridade;

      document.getElementById("prioridadeSelecionada").textContent = prioridade;
    }

    function mostrarDemanda(item) {

      const demanda = document.createElement("div");

      demanda.innerHTML = `
        <h3>${item.titulo}</h3>
        <p>${item.descricao}</p>
        <p><strong>Status:</strong> ${item.status}</p>
        <p><strong>Prioridade:</strong> ${item.prioridade}</p>
        <hr>
      `;

      listaDemandas.appendChild(demanda);
    }

    demandas.forEach(function(item) {
      mostrarDemanda(item);
    });

    btnSalvar.addEventListener("click", function() {

      const titulo = document.getElementById("titulo").value;
      const descricao = document.getElementById("descricao").value;

      if (titulo === "" || descricao === "") {
        alert("Preencha o título e a descrição.");
        return;
      }

      const novaDemanda = {
        titulo: titulo,
        descricao: descricao,
        status: statusAtual,
        prioridade: prioridadeAtual
      };

      demandas.push(novaDemanda);

      localStorage.setItem("demandas", JSON.stringify(demandas));

      mostrarDemanda(novaDemanda);

      document.getElementById("titulo").value = "";
      document.getElementById("descricao").value = "";

      statusAtual = "Aberta";
      prioridadeAtual = "Média";

      document.getElementById("statusSelecionado").textContent = "Aberta";
      document.getElementById("prioridadeSelecionada").textContent = "Média";

      formulario.style.display = "none";

    });

  </script>

</body>
</html>
